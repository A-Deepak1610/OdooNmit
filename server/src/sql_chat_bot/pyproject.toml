[project]
name = "sql-chat-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rithishcodespace", email = "rithishcodespace@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
    "sqlglot>=30.22.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sql-chat-bot = "sql_chat_bot:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
